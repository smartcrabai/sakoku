[package]
name = "sakoku"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/smartcrabai/sakoku"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"

[profile.release]
codegen-units = 1
lto = true
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
dbg_macro = "deny"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell", "homebrew"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
publish-jobs = ["homebrew"]
install-path = "CARGO_HOME"
tap = "takumi3488/homebrew-tap"
